title: Realtime LLM literature review
description: Environments and solutions for LLMs that sense, think and act in realtime
theme: jekyll-theme-primer
plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-default-layout
relative_links:
  enabled: true
  collections: false
exclude:
  - .github
  - .claude
